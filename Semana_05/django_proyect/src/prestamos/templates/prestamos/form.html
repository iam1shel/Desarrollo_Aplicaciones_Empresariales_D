{% extends "base.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="container">
    <div class="page-head">
        <div>
            <h1>{{ titulo }}</h1>
            <p class="muted">Los cambios se guardan de forma persistente.</p>
        </div>
    </div>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="toolbar">
            <button type="submit">Guardar</button>
            <a class="btn btn-secondary" href="{% url url_cancelar %}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
