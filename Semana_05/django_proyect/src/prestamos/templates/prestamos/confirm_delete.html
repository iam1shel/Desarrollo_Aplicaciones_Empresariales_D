{% extends "base.html" %}

{% block title %}Eliminar {{ tipo }}{% endblock %}

{% block content %}
<div class="container">
    <h1>Eliminar {{ tipo }}</h1>
    <div class="warning">
        <p>¿Seguro que desea eliminar <strong>{{ objeto }}</strong>?</p>
        <p class="muted">Esta acción no se puede deshacer.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="toolbar">
            <button class="btn-danger" type="submit">Sí, eliminar</button>
            <a class="btn btn-secondary" href="{% url url_cancelar %}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
